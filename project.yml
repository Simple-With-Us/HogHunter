name: HogHunter

# 2026-09-22 — bundle ID migration: com.jayservices.HogHunter → com.simplewithus.hoghunter.macos
#   bundleIdPrefix moved to the new owned-domain base.  The PRODUCT_BUNDLE_IDENTIFIER
#   values below are explicit and override the prefix-derived defaults.  See
#   docs/rollouts/2026-09-22-bundle-id-migration.md for the full migration context.
#
# 2026-09-26 — iOS companion.  HogHunterIOS is a separate scheme so the Mac CI
#   test destination stays platform=macOS.  See docs/rollouts/2026-09-26-ios-companion.md.
options:
  bundleIdPrefix: com.simplewithus.hoghunter
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "202610060122"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

targets:
  HogHunter:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - sdk: ServiceManagement.framework
      - sdk: UserNotifications.framework
      - sdk: libsqlite3.tbd
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.hoghunter.macos
        # PRODUCT_NAME stays one word: it names the executable inside the
        # bundle, which is what `pgrep -x` and the install script match.  The
        # two name keys below are what a person sees -- Finder, Get Info,
        # LaunchServices, Activity Monitor -- and they are "Hog Hunter".
        PRODUCT_NAME: HogHunter
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_KEY_CFBundleDisplayName: "Hog Hunter"
        INFOPLIST_KEY_CFBundleName: "Hog Hunter"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Jay Wedgeworth"
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_FILE: macos/Info.plist
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          CODE_SIGN_ENTITLEMENTS: HogHunter.entitlements

  HogHunterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HogHunterTests
    dependencies:
      - target: HogHunter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.hoghunter.macos.tests
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  HogHunterIOS:
    type: application
    platform: iOS
    sources:
      - path: ios/Sources
      - path: Sources/Companion/CompanionSnapshot.swift
      - path: Sources/Companion/CompanionHTTP.swift
      # The same sparkline the Mac menu bar draws, so the two cannot differ.
      - path: Sources/UI/CpuSparklineView.swift
      - path: ios/Assets.xcassets
    dependencies:
      - target: HogHunterWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.hoghunter.ios
        PRODUCT_NAME: HogHunter
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.6"
        CURRENT_PROJECT_VERSION: "202610060122"
        INFOPLIST_KEY_CFBundleDisplayName: "Hog Hunter"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: NO
        INFOPLIST_FILE: ios/Info.plist

  HogHunterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Widgets
      - path: Sources/Companion/CompanionSnapshot.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.hoghunter.ios.widgets
        PRODUCT_NAME: HogHunterWidgets
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.6"
        CURRENT_PROJECT_VERSION: "202610060122"
        INFOPLIST_KEY_CFBundleDisplayName: "Hog Hunter"
        INFOPLIST_FILE: ios/Widgets/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: NO

schemes:
  HogHunter:
    build:
      targets:
        HogHunter: all
        HogHunterTests: [test]
    test:
      targets:
        - HogHunterTests
  HogHunterIOS:
    build:
      targets:
        HogHunterIOS: all
        HogHunterWidgets: all
