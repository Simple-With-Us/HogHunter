name: HogHunter

# 2026-09-22 — bundle ID migration: com.jayservices.HogHunter → com.simplewithus.hoghunter.macos
#   bundleIdPrefix moved to the new owned-domain base.  The PRODUCT_BUNDLE_IDENTIFIER
#   values below are explicit and override the prefix-derived defaults.  See
#   docs/rollouts/2026-09-22-bundle-id-migration.md for the full migration context.
#
# 2026-09-26 — iOS companion.  HogHunterIOS is a separate scheme so the Mac CI
#   test destination stays platform=macOS.  See docs/rollouts/2026-09-26-ios-companion.md.
options:
  bundleIdPrefix: com.simplewithus.hoghunter
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

# 2026-10-11 — Sentry (project `hoghunter`).  sentry-cocoa serves the macOS
#   menubar app and the iOS companion.  The DSN is never stored here: both
#   app Info.plists expand `$(SENTRY_DSN)` from the build environment, and an
#   empty value makes `SentryTelemetry.start()` a silent no-op.
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    # 8.56+ has configureProfiling (8.x profilesSampleRate is gone in 9).
    # Tag 9.30.1.  sentry-cocoa 9's Swift 6.2 manifest depends on KSCrash
    # by git revision, which SPM treats as unstable, so any version pin
    # (`from`, `minorVersion`, `exactVersion`) fails to resolve.  A
    # commit pin is the requirement SPM will accept.
    revision: 4f135c52afeeb1d6937eb93824c7ec1cddcaa372
  # 2026-10-14 — Sparkle 2: every merge to main ships a signed Mac release
  # and installed copies update themselves (docs/AUTO-UPDATE.md, the fleet
  # pattern piloted by CodeCaps).  Mac target only: Sparkle is AppKit-only
  # and must never link into the iOS companion.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    # RECORD OF WHAT SHIPPED, not the source of truth for what ships next:
    # the ship script passes both values on the xcodebuild command line, and
    # reads this one as the build-number FLOOR, so it must stay below the
    # commit count of any commit that can ship.
    MARKETING_VERSION: "1.0.152"
    CURRENT_PROJECT_VERSION: "152"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES

targets:
  HogHunter:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: macos/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Sentry
        product: Sentry
      # Sparkle 2 self-update (Mac only).  Xcode embeds the framework into
      # Contents/Frameworks; scripts/mac-release-build.sh asserts that.
      - package: Sparkle
        product: Sparkle
      - sdk: ServiceManagement.framework
      - sdk: UserNotifications.framework
      - sdk: libsqlite3.tbd
      - sdk: IOKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.hoghunter.macos
        # PRODUCT_NAME stays one word: it names the executable inside the
        # bundle, which is what `pgrep -x` and the install script match.  The
        # two name keys below are what a person sees -- Finder, Get Info,
        # LaunchServices, Activity Monitor -- and they are "Hog Hunter".
        PRODUCT_NAME: HogHunter
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_KEY_CFBundleDisplayName: "Hog Hunter"
        INFOPLIST_KEY_CFBundleName: "Hog Hunter"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright 2026 Jay Wedgeworth"
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_FILE: macos/Info.plist
        # Empty unless `xcodebuild SENTRY_DSN=...` or the environment supplies it.
        SENTRY_DSN: ""
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.hoghunter.macos.development
          INFOPLIST_KEY_CFBundleName: "Hog Hunter Dev"
          INFOPLIST_KEY_CFBundleDisplayName: "Hog Hunter Dev"
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          CODE_SIGN_ENTITLEMENTS: HogHunter.entitlements

  HogHunterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HogHunterTests
      # Foundation-only, so the Mac test bundle can compile the link rules
      # without the iOS app.
      - path: ios/Sources/CompanionDeepLink.swift
    dependencies:
      - target: HogHunter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.hoghunter.macos.tests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.hoghunter.macos.development.tests

  HogHunterIOS:
    type: application
    platform: iOS
    sources:
      - path: ios/Sources
      # Same widget views the extension draws, so -HogHunterWidgetPreview can
      # render them.  The @main widget stays in the extension target only.
      - path: ios/Widgets/HogHunterWidgetViews.swift
      - path: Sources/Companion/CompanionSnapshot.swift
      - path: Sources/Companion/CompanionHTTP.swift
      # Decides whether the Mac is on the local network or Tailscale, the same
      # way the Mac decides it about the phone.
      - path: Sources/Companion/CompanionPeer.swift
      # The same sparkline the Mac menu bar draws, so the two cannot differ.
      - path: Sources/UI/CpuSparklineView.swift
      # Shared Sentry bootstrap (DSN from Info.plist, empty is a no-op).
      - path: Sources/Telemetry/SentryTelemetry.swift
      - path: ios/Assets.xcassets
      - path: ios/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: Sentry
        product: Sentry
      - target: HogHunterWidgets
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.hoghunter.ios
        PRODUCT_NAME: HogHunter
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Placeholder: the TestFlight ship passes both values on the xcodebuild
        # command line (fixed 0.1.0 marketing version, planned merge-timestamp
        # build), so these never ship.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "202610290000"
        INFOPLIST_KEY_CFBundleDisplayName: "Hog Hunter"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: NO
        INFOPLIST_FILE: ios/Info.plist
        # Empty unless the TestFlight archive passes SENTRY_DSN=...
        SENTRY_DSN: ""

  HogHunterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Widgets
      - path: Sources/Companion/CompanionSnapshot.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.hoghunter.ios.widgets
        PRODUCT_NAME: HogHunterWidgets
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Placeholder: the TestFlight ship passes both values on the xcodebuild
        # command line (fixed 0.1.0 marketing version, planned merge-timestamp
        # build), so these never ship.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "202610290000"
        INFOPLIST_KEY_CFBundleDisplayName: "Hog Hunter"
        INFOPLIST_FILE: ios/Widgets/Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: NO

schemes:
  HogHunter:
    build:
      targets:
        HogHunter: all
        HogHunterTests: [test]
    test:
      targets:
        - HogHunterTests
  HogHunterIOS:
    build:
      targets:
        HogHunterIOS: all
        HogHunterWidgets: all
