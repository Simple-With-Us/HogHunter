name: Hog Hunter iOS TestFlight (manual)

# Preparation only until replacement signing material is installed.
# No push, schedule, or PR event can archive or upload a build.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Unique numeric build number (blank uses this workflow run number)'
        required: false
        type: string
      upload:
        description: 'Upload the validated export to App Store Connect'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hoghunter-ios-testflight
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.HH_IOS_TESTFLIGHT_ENABLED == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      HH_TESTFLIGHT_UPLOAD: ${{ inputs.upload }}
      HH_BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release inputs and tools
        run: |
          set -euo pipefail
          build_number="${HH_BUILD_NUMBER_INPUT:-$GITHUB_RUN_NUMBER}"
          [[ "$build_number" =~ ^[1-9][0-9]{0,8}$ ]] || { echo '::error::Build number must be 1-9 digits without leading zero.'; exit 1; }
          echo "HH_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          xcodebuild -version
          xcode_major="$(xcodebuild -version | awk 'NR==1 {split($2, parts, "."); print parts[1]}')"
          [[ "$xcode_major" -ge 26 ]] || { echo '::error::Stable Xcode 26 or later is required.'; exit 1; }
          NONINTERACTIVE=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Load Infisical signing secrets
        env:
          SECRET_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          SECRET_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SECRET_IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          SECRET_IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          SECRET_ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set +o xtrace
          set -euo pipefail

          if [ -n "${SECRET_ASC_KEY_ID:-}" ] && [ -n "${SECRET_ASC_ISSUER_ID:-}" ] && \
             [ -n "${SECRET_IOS_DIST_P12_BASE64:-}" ] && [ -n "${SECRET_IOS_DIST_P12_PASSWORD:-}" ] && \
             [ -n "${SECRET_ASC_KEY_P8:-}" ]; then
            for name in ASC_KEY_ID ASC_ISSUER_ID \
                        IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD; do
              case "$name" in
                ASC_KEY_ID) val="$SECRET_ASC_KEY_ID" ;;
                ASC_ISSUER_ID) val="$SECRET_ASC_ISSUER_ID" ;;
                IOS_DIST_P12_BASE64) val="$SECRET_IOS_DIST_P12_BASE64" ;;
                IOS_DIST_P12_PASSWORD) val="$SECRET_IOS_DIST_P12_PASSWORD" ;;
              esac
              if [[ "$val" == *$'\n'* || "$val" == *$'\r'* ]]; then
                echo "::error::Signing field $name must be single-line; correct secret formatting." >&2
                exit 1
              fi
              printf '::add-mask::%s\n' "${val//'%'/'%25'}"
              printf -v "$name" '%s' "$val"
              export "${name?}"
              if [[ "$name" == ASC_KEY_ID || "$name" == ASC_ISSUER_ID ]]; then
                printf '%s=%s\n' "$name" "$val" >> "$GITHUB_ENV"
              fi
            done
            key_material="$SECRET_ASC_KEY_P8"
          else
            export INFISICAL_DISABLE_UPDATE_CHECK=true

            if ! command -v infisical >/dev/null 2>&1; then
              NONINTERACTIVE=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install infisical/get-cli/infisical
            fi
            command -v infisical >/dev/null 2>&1 || {
              echo "::error::Infisical CLI is not installed."
              exit 1
            }

            if [ -z "${INFISICAL_PROJECT_ID:-}" ]; then
              echo "::error::Missing INFISICAL_PROJECT_ID GitHub secret."
              exit 1
            fi
            CLIENT_ID="${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}"
            CLIENT_SECRET="${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}"
            if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
              CLIENT_ID="${INFISICAL_CLIENT_ID:-}"
              CLIENT_SECRET="${INFISICAL_CLIENT_SECRET:-}"
            fi
            if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
              echo "::error::Missing Infisical machine identity.  Set INFISICAL_UNIVERSAL_AUTH_CLIENT_ID/SECRET (fallback INFISICAL_CLIENT_ID/SECRET) on the repo."
              exit 1
            fi

            TOKEN="$(
              env -u INFISICAL_CLIENT_ID -u INFISICAL_CLIENT_SECRET -u INFISICAL_TOKEN \
                INFISICAL_UNIVERSAL_AUTH_CLIENT_ID="$CLIENT_ID" \
                INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET="$CLIENT_SECRET" \
                infisical login --method=universal-auth --silent --plain --telemetry=false 2>/dev/null || true
            )"
            if [ -z "$TOKEN" ]; then
              echo "::error::Infisical universal-auth login failed."
              exit 1
            fi
            if [[ "$TOKEN" == *$'\n'* || "$TOKEN" == *$'\r'* ]]; then
              echo '::error::Infisical returned a multiline token.' >&2
              exit 1
            fi
            printf '::add-mask::%s\n' "${TOKEN//'%'/'%25'}"

            for name in ASC_KEY_ID ASC_ISSUER_ID \
                        IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD; do
              val="$(
                INFISICAL_TOKEN="$TOKEN" infisical secrets get "$name" \
                  --plain --silent --telemetry=false --expand=false \
                  --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/ \
                  2>/dev/null || true
              )"
              if [ -z "$val" ]; then
                continue
              fi
              if [[ "$val" == *$'\n'* || "$val" == *$'\r'* ]]; then
                echo "::error::Signing field $name must be single-line; correct Infisical formatting." >&2
                exit 1
              fi
              printf '::add-mask::%s\n' "${val//'%'/'%25'}"
              printf -v "$name" '%s' "$val"
              export "${name?}"
              # Certificate credentials belong only to this load/import step.
              if [[ "$name" == ASC_KEY_ID || "$name" == ASC_ISSUER_ID ]]; then
                printf '%s=%s\n' "$name" "$val" >> "$GITHUB_ENV"
              fi
            done
            # Keep multiline PEM out of GITHUB_ENV and every later step environment.
            # Only its mode-600 file path crosses the step boundary.
            key_material="$(
              INFISICAL_TOKEN="$TOKEN" infisical secrets get ASC_KEY_P8 \
                --plain --silent --telemetry=false --expand=false \
                --projectId="$INFISICAL_PROJECT_ID" --env=prod --path=/ \
                2>/dev/null || true
            )"
            if [ -z "$key_material" ]; then
              echo "::error::Missing ASC key material in Infisical prod."
              exit 1
            fi
          fi
          printf '%s\n' "$key_material" | bash "$GITHUB_WORKSPACE/scripts/ios-stage-asc-key.sh"
          ASC_KEY_PATH="$(sed -n 's/^ASC_KEY_PATH=//p' "$GITHUB_ENV" | tail -n 1)"
          export ASC_KEY_PATH
          bash "$GITHUB_WORKSPACE/scripts/ios-appstore-gm-prepare.sh"
          unset key_material TOKEN CLIENT_ID CLIENT_SECRET val IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD \
                SECRET_ASC_KEY_ID SECRET_ASC_ISSUER_ID SECRET_IOS_DIST_P12_BASE64 SECRET_IOS_DIST_P12_PASSWORD SECRET_ASC_KEY_P8

      - name: Archive, validate, export, and optionally upload
        run: bash scripts/ios-testflight-release.sh

      - name: Remove runner signing material
        if: always()
        run: |
          set +o xtrace
          set -euo pipefail
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/app-signing-kc-pass" "$HOME/.secrets/ios-distribution.p12" "$HOME/.secrets/appstore-connect.env"
          if [[ -n "${ASC_KEY_PATH:-}" && "$ASC_KEY_PATH" == "$RUNNER_TEMP"/asc-signing.*/AuthKey.p8 ]]; then
            rm -rf "$(dirname "$ASC_KEY_PATH")"
          fi
