name: Hog Hunter iOS TestFlight

# AUTO-SHIP CONTRACT (owner 2026-10-17):  a merge to main that touches the iPhone
# companion's native tree uploads a fresh TestFlight build with no human step,
# and publishes What to Test (IOS_TF_RELEASE_NOTES=1).  "The native tree" is
# ios/** and project.yml PLUS the shared Mac sources the iOS targets compile
# (project.yml, targets HogHunterIOS and HogHunterWidgets).  They are listed as
# exact files, not Sources/Companion/**:  most of that directory is the Mac
# companion server, and a Mac-only edit must not cut a TestFlight build.
# scripts/test-ios-release.py pins both lists (these push paths and the
# scheduled gate prefixes below) to project.yml, so a file added to the iOS
# targets cannot quietly stop shipping.  workflow_dispatch is the manual path.
#
# The ship goes through the fleet script (scripts/ios-fleet/ship-testflight.sh,
# via scripts/ios-ship-testflight.sh), the same path Socratic.Trade,
# Congress.Trade, Usage Monitor and Clutch use.  It owns:
#   * the marketing version and the build number:  the fixed 0.1.0 marketing
#     version and one shared merge-timestamp build per release, max(S, M + 1),
#     computed ONCE by the plan-build job below (ship-testflight.sh
#     --plan-build-only, read-only over App Store Connect and the merge stamp
#     of HEAD) and handed to the ship through --build, so a version string is
#     never uploaded twice;
#   * the rate gate (one upload per hour) and the same-HEAD skip.  This file
#     never sets IOS_TF_MIN_INTERVAL_SEC and never passes --force-ship;
#   * ensure-tf-ready, which declares export compliance on the exact build and
#     waits for it to be installable (ios/Info.plist already carries
#     ITSAppUsesNonExemptEncryption=false);
#   * What to Test, rendered from the commits since the last ship, with no
#     agent names.
#
# Credentials (names only;  values are never printed):
#   * ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 come from Fleet-OPS Infisical prod
#     /asc, the fleet's single copy (owner ruling 2026-10-17).  The same-named
#     repository secrets are a stale copy and are deliberately not read, with
#     no fallback to them.  The multiline PEM never enters GITHUB_ENV;  the
#     hosted form is the base64 trio (APPLE_API_KEY_ID, APPLE_API_ISSUER_ID and
#     APPLE_API_KEY_P8_BASE64), which is one line and which the shell layer
#     and the client both read from the environment.  A path on disk is not an
#     approved credential source (AFC-459), so a named ASC_KEY_PATH is ignored.
#     scripts/ios-stage-asc-key.sh writes the key to a mode 600 file, and only
#     that path is used, by the Apple tools that can only read a key from disk.
#   * IOS_DIST_P12_BASE64 and IOS_DIST_P12_PASSWORD (the Apple Distribution
#     identity) are repository secrets, scoped to the import step only.
#   * SENTRY_DSN and SENTRY_AUTH_TOKEN are best effort:  an inert Sentry beats a
#     red ship.  Infisical prod first, same-named repository secrets after.
#
# WHY THERE IS A `schedule:` TRIGGER
# A pull request merged by github-actions[bot] lands on main under GitHub's
# recursion guard and dispatches no push run, and a push run that failed is
# never retried.  A cron is exempt from both.  It is gated twice:
# scripts/ios-fleet/scheduled-ship-gate.sh refuses unless a native path changed
# since the last successful ship, and the ship script rate-limits and skips an
# already-shipped HEAD.  A tick with nothing to ship exits in seconds.  push and
# workflow_dispatch skip the path gate (a push already passed `paths:`).
#
# The ship state (~/.cache/ios-fleet) is restored from actions/cache because a
# hosted runner starts with an empty home;  without it every run would look like
# "no prior ship".
#
# A dispatch with upload=false archives and exports without uploading, and is
# the one run allowed from a branch:  it proves signing and the build on a
# change before it reaches main.  It loads no Sentry secret and writes no state.
#
# The repository variable HH_IOS_TESTFLIGHT_ENABLED is the kill switch for every
# trigger.  `gh workflow view ios-testflight.yml` says if this file is disabled.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'project.yml'
      # Shared Mac sources the iOS app and widget targets compile.  Exact files,
      # not Sources/Companion/**.
      - 'Sources/Companion/CompanionSnapshot.swift'
      - 'Sources/Companion/CompanionHTTP.swift'
      - 'Sources/Companion/CompanionPeer.swift'
      - 'Sources/UI/CpuSparklineView.swift'
      - 'Sources/Telemetry/SentryTelemetry.swift'
      # The ship machinery itself, so a fix to it is proven by a real ship.
      - '.github/workflows/ios-testflight.yml'
      - '.github/actions/infisical-secrets/**'
      - 'scripts/infisical-fetch.mjs'
      - 'scripts/ios-*.sh'
      - 'scripts/ios-fleet/**'
      - '!scripts/ios-fleet/test-*.sh'
      - '!scripts/ios-fleet/README.md'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight (false archives and exports only, and may run from a branch)'
        required: false
        default: true
        type: boolean
  schedule:
    # Hourly at :41, offset from the other fleet ship crons (:07 and :37 Congress,
    # :13 and :43 Usage, :23 Clutch, :26 and :56 CodeCaps, :00 and :30 Socratic).
    - cron: '41 * * * *'

permissions:
  contents: read

concurrency:
  group: hoghunter-ios-testflight
  cancel-in-progress: false

jobs:
  # The release build, computed ONCE per release (owner 2026-10-29).  Every
  # ship job of the release reuses this one value through --build, so two
  # platforms can never compute different builds.  Read-only: it queries App
  # Store Connect and the merge stamp of HEAD, plans nothing when the
  # inventory is incomplete, and consumes nothing.  It runs before the ship
  # gate on purpose -- a tick with nothing to ship still plans a number, and
  # the ship job below then gates out and uploads nothing.
  plan-build:
    name: Plan release build
    if: >-
      github.event.repository.fork == false &&
      vars.HH_IOS_TESTFLIGHT_ENABLED == 'true' &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'workflow_dispatch' && inputs.upload == false))
    runs-on: macos-latest
    timeout-minutes: 15
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # ASC key from Fleet-OPS prod /asc.  Same block as the ship job:  the
      # planner queries App Store Connect, so it loads the credential the
      # same way (names only;  values are never printed).
      - name: Load ASC credentials (Fleet-OPS prod /asc)
        env:
          # The org secret shared with this repository (ContactLogo reads /asc
          # the same way), so this public file never names the project.
          ASC_INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_FLEET_OPS_PROJECT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set +o xtrace
          set -euo pipefail
          export INFISICAL_DISABLE_UPDATE_CHECK=true

          if [ -z "${ASC_INFISICAL_PROJECT_ID:-}" ]; then
            echo "::error::The org secret INFISICAL_FLEET_OPS_PROJECT_ID is empty or not shared with this repository." >&2
            exit 1
          fi

          if ! command -v infisical >/dev/null 2>&1; then
            NONINTERACTIVE=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install infisical/get-cli/infisical
          fi
          command -v infisical >/dev/null 2>&1 || {
            echo "::error::Infisical CLI is not installed."
            exit 1
          }

          CLIENT_ID="${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}"
          CLIENT_SECRET="${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}"
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            CLIENT_ID="${INFISICAL_CLIENT_ID}"
            CLIENT_SECRET="${INFISICAL_CLIENT_SECRET}"
          fi
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Missing Infisical machine identity.  Set INFISICAL_UNIVERSAL_AUTH_CLIENT_ID/SECRET (fallback INFISICAL_CLIENT_ID/SECRET) on the org or repo."
            exit 1
          fi

          TOKEN="$(
            env -u INFISICAL_CLIENT_ID -u INFISICAL_CLIENT_SECRET -u INFISICAL_TOKEN \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_ID="$CLIENT_ID" \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET="$CLIENT_SECRET" \
              infisical login --method=universal-auth --silent --plain --telemetry=false 2>/dev/null || true
          )"
          if [ -z "$TOKEN" ]; then
            echo "::error::Infisical universal-auth login failed."
            exit 1
          fi
          if [[ "$TOKEN" == *$'\n'* || "$TOKEN" == *$'\r'* ]]; then
            echo '::error::Infisical returned a multiline token.' >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "${TOKEN//'%'/'%25'}"

          for name in ASC_KEY_ID ASC_ISSUER_ID; do
            val="$(
              INFISICAL_TOKEN="$TOKEN" infisical secrets get "$name" \
                --plain --silent --telemetry=false --expand=false \
                --projectId="$ASC_INFISICAL_PROJECT_ID" --env=prod --path=/asc \
                2>/dev/null || true
            )"
            if [ -z "$val" ]; then
              echo "::error::Missing $name in Fleet-OPS prod /asc;  verify the CI identity has read access to the Fleet-OPS project, path /asc." >&2
              exit 1
            fi
            if [[ "$val" == *$'\n'* || "$val" == *$'\r'* ]]; then
              echo "::error::Signing field $name must be single-line;  correct Infisical formatting." >&2
              exit 1
            fi
            printf '::add-mask::%s\n' "${val//'%'/'%25'}"
            printf '%s=%s\n' "$name" "$val" >> "$GITHUB_ENV"
            #  The same values under the hosted names the shell layer and the
            #  client read:  ASC_KEY_ID becomes APPLE_API_KEY_ID.
            printf 'APPLE_API_%s=%s\n' "${name#ASC_}" "$val" >> "$GITHUB_ENV"
          done

          # Keep the multiline PEM out of GITHUB_ENV and every later step
          # environment.  The staged file below carries it, and only the path
          # crosses the step boundary.
          key_material="$(
            INFISICAL_TOKEN="$TOKEN" infisical secrets get ASC_KEY_P8 \
              --plain --silent --telemetry=false --expand=false \
              --projectId="$ASC_INFISICAL_PROJECT_ID" --env=prod --path=/asc \
              2>/dev/null || true
          )"
          if [ -z "$key_material" ]; then
            echo "::error::Missing ASC key material in Fleet-OPS prod /asc;  verify the CI identity has read access to the Fleet-OPS project, path /asc." >&2
            exit 1
          fi
          printf '%s\n' "$key_material" | bash "$GITHUB_WORKSPACE/scripts/ios-stage-asc-key.sh"

          # The hosted form of the credential:  the key id, the issuer and the
          # key as base64.  `base64` wraps its output at 76 columns, and a
          # multi-line blob would leak every line after the first unmasked
          # (add-mask is parsed per line) and break the environment file, so
          # the value is flattened to one line and the raw PEM never enters
          # GITHUB_ENV.  The shell layer and the client both read the trio
          # from the environment, because a path on disk is not an approved
          # credential source (AFC-459).
          key_b64="$(printf '%s' "$key_material" | base64 | tr -d '\n')"
          printf '::add-mask::%s\n' "${key_b64//'%'/'%25'}"
          printf 'APPLE_API_KEY_P8_BASE64=%s\n' "$key_b64" >> "$GITHUB_ENV"

          unset key_material key_b64 TOKEN CLIENT_ID CLIENT_SECRET val

      - name: Plan the release build
        id: plan
        run: |
          set -euo pipefail
          build="$(bash "$GITHUB_WORKSPACE/scripts/ios-fleet/ship-testflight.sh" hoghunter --plan-build-only --repo-root "$GITHUB_WORKSPACE")"
          if ! [[ "$build" =~ ^[1-9][0-9]{11}$ ]]; then
            echo "::error::plan-build produced a malformed build." >&2
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "::notice title=Release build::Planned build $build for this release."

  ship:
    name: TestFlight archive + upload
    needs: [plan-build]
    if: >-
      github.event.repository.fork == false &&
      vars.HH_IOS_TESTFLIGHT_ENABLED == 'true' &&
      (github.ref == 'refs/heads/main' ||
       (github.event_name == 'workflow_dispatch' && inputs.upload == false))
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The scheduled gate diffs HEAD against the sha recorded by the last
          # successful ship, and the release notes list the commits since it.
          # A shallow clone makes both ranges uncomputable.
          fetch-depth: 0

      - name: Resolve ship mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          UPLOAD_INPUT: ${{ inputs.upload }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$UPLOAD_INPUT" = "false" ]; then
            echo "export_only=1" >> "$GITHUB_OUTPUT"
            echo "::notice title=Export only::upload=false:  archiving and exporting without an upload."
          else
            echo "export_only=0" >> "$GITHUB_OUTPUT"
          fi

      # Restore and save are separate steps because actions/cache saves only in
      # its post step, and that step is skipped when the job fails.  A failed
      # ship must still save the build sequence it consumed.
      - name: Restore iOS ship state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-state-hoghunter-ios-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-fleet-state-hoghunter-ios-${{ github.run_id }}-
            ios-fleet-state-hoghunter-ios-

      # The archive lock is a directory, and a cancelled run can save it into
      # the cache.  Nothing else runs on a fresh hosted runner, so any lock
      # restored from the cache is stale.
      - name: Clear stale locks from the ship state
        run: rm -rf "$HOME"/.cache/ios-fleet/*.lockdir

      # Runs before any toolchain or secret step, so a tick with nothing to ship
      # costs seconds.  Prefixes mirror on.push.paths (minus the machinery files,
      # which only a push or a dispatch should act on).  The logic lives in a
      # script so CI unit-tests it.
      - name: Scheduled ship gate (skip unless iOS code changed)
        id: gate
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ios-fleet/scheduled-ship-gate.sh" \
            --event "${{ github.event_name }}" \
            --path-prefix 'ios/' \
            --path-prefix 'project.yml' \
            --path-prefix 'Sources/Companion/CompanionSnapshot.swift' \
            --path-prefix 'Sources/Companion/CompanionHTTP.swift' \
            --path-prefix 'Sources/Companion/CompanionPeer.swift' \
            --path-prefix 'Sources/UI/CpuSparklineView.swift' \
            --path-prefix 'Sources/Telemetry/SentryTelemetry.swift' \
            --repo-root "$GITHUB_WORKSPACE" \
            hoghunter

      - name: Assert stable Xcode 26 or later (never beta)
        if: steps.gate.outputs.should_ship == '1'
        run: |
          set -euo pipefail
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          xcodebuild -version
          case "$DEVELOPER_DIR" in
            *[Bb]eta*)
              echo "::error::DEVELOPER_DIR resolves to a beta Xcode: $DEVELOPER_DIR"
              exit 1
              ;;
          esac
          xcode_major="$(xcodebuild -version | awk 'NR==1 {split($2, parts, "."); print parts[1]}')"
          [[ "$xcode_major" -ge 26 ]] || { echo '::error::Stable Xcode 26 or later is required.'; exit 1; }

      - name: Install xcodegen
        if: steps.gate.outputs.should_ship == '1'
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            NONINTERACTIVE=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          fi
          xcodegen --version

      # Do not use `secrets.*` in `if:` -- GitHub's dispatch parser rejects it
      # (`Unrecognized named-value: secrets`) and the whole workflow dies at 0s.

      # ASC key from Fleet-OPS prod /asc.  ASC_KEY_ID and ASC_ISSUER_ID are
      # single line and go to GITHUB_ENV;  the multiline private key is staged
      # to a mode 600 file and only ASC_KEY_PATH is exported.
      - name: Load ASC credentials (Fleet-OPS prod /asc)
        if: steps.gate.outputs.should_ship == '1'
        env:
          # The org secret shared with this repository (ContactLogo reads /asc
          # the same way), so this public file never names the project.
          ASC_INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_FLEET_OPS_PROJECT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set +o xtrace
          set -euo pipefail
          export INFISICAL_DISABLE_UPDATE_CHECK=true

          if [ -z "${ASC_INFISICAL_PROJECT_ID:-}" ]; then
            echo "::error::The org secret INFISICAL_FLEET_OPS_PROJECT_ID is empty or not shared with this repository." >&2
            exit 1
          fi

          if ! command -v infisical >/dev/null 2>&1; then
            NONINTERACTIVE=1 HOMEBREW_NO_AUTO_UPDATE=1 brew install infisical/get-cli/infisical
          fi
          command -v infisical >/dev/null 2>&1 || {
            echo "::error::Infisical CLI is not installed."
            exit 1
          }

          CLIENT_ID="${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}"
          CLIENT_SECRET="${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}"
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            CLIENT_ID="${INFISICAL_CLIENT_ID}"
            CLIENT_SECRET="${INFISICAL_CLIENT_SECRET}"
          fi
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Missing Infisical machine identity.  Set INFISICAL_UNIVERSAL_AUTH_CLIENT_ID/SECRET (fallback INFISICAL_CLIENT_ID/SECRET) on the org or repo."
            exit 1
          fi

          TOKEN="$(
            env -u INFISICAL_CLIENT_ID -u INFISICAL_CLIENT_SECRET -u INFISICAL_TOKEN \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_ID="$CLIENT_ID" \
              INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET="$CLIENT_SECRET" \
              infisical login --method=universal-auth --silent --plain --telemetry=false 2>/dev/null || true
          )"
          if [ -z "$TOKEN" ]; then
            echo "::error::Infisical universal-auth login failed."
            exit 1
          fi
          if [[ "$TOKEN" == *$'\n'* || "$TOKEN" == *$'\r'* ]]; then
            echo '::error::Infisical returned a multiline token.' >&2
            exit 1
          fi
          printf '::add-mask::%s\n' "${TOKEN//'%'/'%25'}"

          for name in ASC_KEY_ID ASC_ISSUER_ID; do
            val="$(
              INFISICAL_TOKEN="$TOKEN" infisical secrets get "$name" \
                --plain --silent --telemetry=false --expand=false \
                --projectId="$ASC_INFISICAL_PROJECT_ID" --env=prod --path=/asc \
                2>/dev/null || true
            )"
            if [ -z "$val" ]; then
              echo "::error::Missing $name in Fleet-OPS prod /asc;  verify the CI identity has read access to the Fleet-OPS project, path /asc." >&2
              exit 1
            fi
            if [[ "$val" == *$'\n'* || "$val" == *$'\r'* ]]; then
              echo "::error::Signing field $name must be single-line;  correct Infisical formatting." >&2
              exit 1
            fi
            printf '::add-mask::%s\n' "${val//'%'/'%25'}"
            printf '%s=%s\n' "$name" "$val" >> "$GITHUB_ENV"
            #  The same values under the hosted names the shell layer and the
            #  client read:  ASC_KEY_ID becomes APPLE_API_KEY_ID.
            printf 'APPLE_API_%s=%s\n' "${name#ASC_}" "$val" >> "$GITHUB_ENV"
          done

          # Keep the multiline PEM out of GITHUB_ENV and every later step
          # environment.  The staged file below carries it, and only the path
          # crosses the step boundary.
          key_material="$(
            INFISICAL_TOKEN="$TOKEN" infisical secrets get ASC_KEY_P8 \
              --plain --silent --telemetry=false --expand=false \
              --projectId="$ASC_INFISICAL_PROJECT_ID" --env=prod --path=/asc \
              2>/dev/null || true
          )"
          if [ -z "$key_material" ]; then
            echo "::error::Missing ASC key material in Fleet-OPS prod /asc;  verify the CI identity has read access to the Fleet-OPS project, path /asc." >&2
            exit 1
          fi
          printf '%s\n' "$key_material" | bash "$GITHUB_WORKSPACE/scripts/ios-stage-asc-key.sh"

          # The hosted form of the credential:  the key id, the issuer and the
          # key as base64.  `base64` wraps its output at 76 columns, and a
          # multi-line blob would leak every line after the first unmasked
          # (add-mask is parsed per line) and break the environment file, so
          # the value is flattened to one line and the raw PEM never enters
          # GITHUB_ENV.  The shell layer and the client both read the trio
          # from the environment, because a path on disk is not an approved
          # credential source (AFC-459).
          key_b64="$(printf '%s' "$key_material" | base64 | tr -d '\n')"
          printf '::add-mask::%s\n' "${key_b64//'%'/'%25'}"
          printf 'APPLE_API_KEY_P8_BASE64=%s\n' "$key_b64" >> "$GITHUB_ENV"

          unset key_material key_b64 TOKEN CLIENT_ID CLIENT_SECRET val

      # The distribution identity.  Scoped to this step's environment only, so
      # the certificate password never reaches the archive step.
      - name: Import signing identity
        if: steps.gate.outputs.should_ship == '1'
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          set +o xtrace
          set -euo pipefail
          if [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_KEY_PATH:-}" ]; then
            echo "::error::ASC credentials were not loaded from Fleet-OPS prod /asc."
            exit 1
          fi
          if [ -z "${IOS_DIST_P12_BASE64:-}" ] || [ -z "${IOS_DIST_P12_PASSWORD:-}" ]; then
            echo "::error::IOS_DIST_P12_BASE64 or IOS_DIST_P12_PASSWORD is empty.  Confirm the IOS_DIST_ repository secrets."
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/scripts/ios-appstore-gm-prepare.sh"

      # Best effort, and skipped for an export-only run so it never spends a
      # Sentry Size Analysis build on a build that is not shipped.
      - name: Load Sentry ship secrets (Infisical, then repository secrets)
        if: steps.gate.outputs.should_ship == '1' && steps.mode.outputs.export_only != '1'
        uses: ./.github/actions/infisical-secrets
        with:
          names: SENTRY_DSN SENTRY_AUTH_TOKEN
          project-id: ${{ secrets.INFISICAL_PROJECT_ID }}
          client-id: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET || secrets.INFISICAL_CLIENT_SECRET }}
        env:
          GH_FALLBACK_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GH_FALLBACK_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Ship Hog Hunter to TestFlight
        id: ship
        if: steps.gate.outputs.should_ship == '1'
        env:
          # Publish What to Test to App Store Connect (owner 2026-09-08).
          IOS_TF_RELEASE_NOTES: "1"
          EXPORT_ONLY: ${{ steps.mode.outputs.export_only }}
          PLANNED_BUILD: ${{ needs.plan-build.outputs.build }}
        run: |
          if [ -z "$PLANNED_BUILD" ]; then
            echo "::error::No planned build from the plan-build job." >&2
            exit 1
          fi
          args=()
          if [ "$EXPORT_ONLY" = "1" ]; then
            args+=(--export-only)
          fi
          bash scripts/ios-ship-testflight.sh --build "$PLANNED_BUILD" ${args[@]+"${args[@]}"}

      # Sync the standing testers and attach/submit the new build to the public
      # external group.  A failure here is a warning, never a red ship.
      - name: Sync standing TestFlight testers
        # Export-only runs archive without touching remote state: no group or
        # tester mutations either (Sentry review on #184).
        if: success() && steps.gate.outputs.should_ship == '1' && steps.mode.outputs.export_only != '1'
        continue-on-error: true
        env:
          ASC_STANDING_TESTERS: ${{ secrets.ASC_STANDING_TESTERS }}
        run: |
          for e in $(printf '%s' "${ASC_STANDING_TESTERS:-}" | tr ',;' '  '); do
            echo "::add-mask::${e}"
          done
          set +e
          appleid="$(python3 -c 'import json;print(json.load(open("scripts/ios-fleet/apps.json"))["apps"]["hoghunter"]["appleId"])')"
          appleid_rc=$?
          set -e
          if [ "$appleid_rc" -ne 0 ] || [ -z "$appleid" ]; then
            echo "::warning title=TestFlight standing testers::could not read the hoghunter appleId from scripts/ios-fleet/apps.json (rc=${appleid_rc}); tester sync skipped.  The TestFlight upload itself succeeded."
            exit 0
          fi
          set +e
          node scripts/ios-fleet/asc-api.mjs ensure-standing-testers "$appleid"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=TestFlight standing testers::tester sync exited ${rc}; see the standing-testers lines above.  The TestFlight upload itself succeeded."
          fi

      # Saved even when the ship failed or was cancelled, but only on a run that
      # tried to ship (a no-op tick changes no state) and never for an
      # export-only run (it records nothing a real ship should inherit).
      - name: Save iOS ship state
        if: ${{ always() && steps.gate.outputs.should_ship == '1' && steps.mode.outputs.export_only != '1' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-state-hoghunter-ios-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove runner signing material
        if: always()
        run: |
          set +o xtrace
          set -euo pipefail
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/app-signing-kc-pass"
          if [[ -n "${ASC_KEY_PATH:-}" && "$ASC_KEY_PATH" == "$RUNNER_TEMP"/asc-signing.*/AuthKey.p8 ]]; then
            rm -rf "$(dirname "$ASC_KEY_PATH")"
          fi
          # altool and the fleet script stage AuthKey_<KEY_ID>.p8 here.  Remove
          # only the file this run staged.
          if [[ -n "${ASC_KEY_ID:-}" ]]; then
            rm -f "${HOME}/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi
