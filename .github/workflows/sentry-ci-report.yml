name: Sentry CI Report

# Fleet-wide CI observability: receives completion events from the observed
# workflows, but only reserves a runner for failures.  It reports those
# events to the shared `fleet-infra` Sentry project (org simple-with-us).
# ADDITIVE ONLY — this file must never modify the behavior of the workflows
# it observes.
#
# Two independent signals per completed run:
#   1. On conclusion == failure / timed_out / startup_failure: a Sentry error
#      event, tagged with {app, workflow, branch, actor}, carrying the run URL,
#      fingerprinted on [ci-failure, hoghunter, workflow].  The branch is a
#      TAG only, never a fingerprint component.
#   2. On event == schedule: a Sentry Crons check-in.  HogHunter currently
#      schedules nothing, so this path is reserved for a future cron lane.
#
# Raw Sentry envelope HTTP via python3 — no action marketplace dependency.
#
# workflows observed (from `ls .github/workflows/` — see each file's `name:`):
#   CI,
#   Hog Hunter iOS TestFlight,
#   iOS Screenshots,
#   Secret scanning
#
# DELIBERATELY NOT observed:
#   - Sentry CI Report (this file) — would recurse.
#   - PR Autofix / Claude Code Autofix / Kody Muse Spark Fix Proposals —
#     bot lanes; a red autofix must not page fleet-infra.
#
# Secret: `SENTRY_FLEET_DSN` (the fleet-infra project DSN) from the repo or
# org Actions secret of the same name.  Name only — never commit or print
# the value.  The reporter exits 0 with a warning when it is absent, so CI
# itself is never red-X'd by a missing DSN.
#
# Gold copy: BotFleet origin/main (from Usage-Monitor PR #1394).

on:
  workflow_run:
    workflows:
      - CI
      - Hog Hunter iOS TestFlight
      - iOS Screenshots
      - Secret scanning
    types: [completed]

permissions:
  contents: read

concurrency:
  group: sentry-ci-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  report:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'startup_failure' ||
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (for the reporter script only; does not touch observed workflows)
        # No `ref:` override: checkout the default branch so this step always
        # runs the trusted, merged copy of the reporter, not a fork/PR copy.
        uses: actions/checkout@v7

      - name: Report failure + cron check-in to Sentry fleet-infra
        shell: bash
        env:
          SENTRY_FLEET_DSN: ${{ secrets.SENTRY_FLEET_DSN }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_ACTOR: ${{ github.event.workflow_run.actor.login }}
          WORKFLOW_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/sentry-ci-report.py
