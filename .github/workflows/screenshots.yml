name: iOS Screenshots

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version for screenshot naming'
        required: false
        default: '1.0.4'

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild -scheme HogHunterIOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios \
            build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Find built app
        id: find-app
        run: |
          APP_PATH=$(find build-ios -name "*.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app: $APP_PATH"

      - name: Capture screenshots
        run: |
          set -x
          mkdir -p screenshots
          APP_PATH="${{ steps.find-app.outputs.app_path }}"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"
          
          # List available runtimes and devices for debugging
          echo "=== Available runtimes ==="
          xcrun simctl list runtimes available
          echo "=== Available device types ==="
          xcrun simctl list devicetypes | head -30
          
          # Use existing simulators instead of creating new ones
          # Map to actual available devices
          for DEVICE_PATTERN in "iPhone 16 Pro Max" "iPhone 15 Pro Max" "iPhone 11 Pro Max"; do
            echo "=== Looking for: $DEVICE_PATTERN ==="
            UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          pattern = '$DEVICE_PATTERN'
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['name'] == pattern and d.get('isAvailable', False):
                      print(d['udid'])
                      sys.exit(0)
          ")
            if [ -z "$UDID" ]; then
              echo "WARNING: No available simulator found for $DEVICE_PATTERN, skipping"
              continue
            fi
            echo "Using simulator $UDID for $DEVICE_PATTERN"
            xcrun simctl boot "$UDID" || true
            sleep 15
            xcrun simctl install "$UDID" "$APP_PATH"
            xcrun simctl launch "$UDID" "$BUNDLE_ID" || echo "Launch may have failed, continuing"
            sleep 8
            SAFE_NAME=$(echo "$DEVICE_PATTERN" | tr ' ' '_' | tr -d '()')
            xcrun simctl io "$UDID" screenshot "screenshots/${SAFE_NAME}.png" || echo "Screenshot failed for $DEVICE_PATTERN"
            xcrun simctl shutdown "$UDID" || true
          done
          
          echo "=== Screenshots captured ==="
          ls -lh screenshots/

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: hoghunter-screenshots-${{ inputs.version }}
          path: screenshots/
          retention-days: 30
