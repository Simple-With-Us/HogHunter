name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check manual release scripts without signing credentials
        run: |
          bash -n scripts/ios-stage-asc-key.sh scripts/ios-appstore-gm-prepare.sh scripts/ios-ship-testflight.sh scripts/ios-fleet/ship-testflight.sh scripts/ios-fleet/scheduled-ship-gate.sh scripts/ios-fleet/test-scheduled-ship-gate.sh scripts/ios-fleet/test-next-shared-build.sh scripts/test-ios-stage-asc-key.sh scripts/capture-app-screenshots.sh scripts/install.sh scripts/mac-release-build.sh scripts/make_appcast.sh
          bash -n scripts/smb-root-files-share.sh
          node --check scripts/ios-fleet/asc-api.mjs
          node --check scripts/ios-fleet/asc-key.mjs
          node --check scripts/ios-fleet/version-plan.mjs
          bash scripts/test-ios-stage-asc-key.sh
          bash scripts/ios-fleet/test-asc-credentials.sh
          node --test scripts/ios-fleet/test-asc-key.test.mjs
          node --test scripts/ios-fleet/test-asc-credentials.mjs
          node --test scripts/ios-fleet/version-plan.test.mjs
          node --test scripts/ios-fleet/shared-build.test.mjs
          node --test scripts/ios-fleet/next-shared-build.test.mjs
          node --test scripts/infisical-fetch.node-test.mjs scripts/infisical-fetch-expand.node-test.mjs
          bash scripts/ios-fleet/test-scheduled-ship-gate.sh
          bash scripts/ios-fleet/test-next-shared-build.sh
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-ios-release.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-ios-screenshot-checks.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-bounded-process.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-sentry-ci-report.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-sentry-wiring.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-smb-root-files-share.py

      - name: Robotic Vacuum Python tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-hoghunter-clean.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-robotic-vacuum.py

      - name: Server status Python tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/server-status -p 'test_*.py'

  test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      HOGHUNTER_RENDER_DIR: ${{ github.workspace }}/screenshots/native-layout
      TEST_RUNNER_HOGHUNTER_RENDER_DIR: ${{ github.workspace }}/screenshots/native-layout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # macOS exposes waitid/WNOWAIT in Python 3.13 and newer.  Keep the
      # supervisor and capture dependencies on the same explicit interpreter.
      - name: Set Up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'

      - name: Test Capture Supervisor on macOS
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-bounded-process.py

      - name: Install dependencies
        run: |
          curl -sSL --fail --retry 3 --retry-all-errors -o /tmp/xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          test -s /tmp/xcodegen.zip
          rm -rf /tmp/xcodegen && ditto -xk /tmp/xcodegen.zip /tmp/xcodegen
          # The zip wraps the binary (xcodegen/bin/xcodegen), not a bare
          # binary, so locate it instead of assuming the layout.
          BIN="$(find /tmp/xcodegen -name xcodegen -type f | head -1)"
          test -n "$BIN" && test -x "$BIN"
          sudo mkdir -p /usr/local/bin
          sudo rm -rf /usr/local/bin/xcodegen
          sudo mv "$BIN" /usr/local/bin/xcodegen
          # The runner shell does not always carry /usr/local/bin on PATH
          # (non-login shell, image-dependent), so pin it for this step and
          # every later one via GITHUB_PATH, and check by absolute path.
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          /usr/local/bin/xcodegen --version
          python3 -m pip install --break-system-packages pyobjc-framework-Quartz || python3 -m pip install pyobjc-framework-Quartz

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          # Plain platform=macOS plus a forced single arch, no index store
          # (CI never reads it).  Plain output, no xcpretty pipe and no
          # -quiet: the module-name failure needs per-file attribution to
          # diagnose, which filtered output strips.  Serialized with -jobs 1:
          # the empty-module failure reads like two concurrent writers on
          # one swiftmodule (same path reported with different mismatches
          # milliseconds apart), so rule parallelism out before anything else.
          set -o pipefail
          xcodebuild -scheme HogHunter -destination 'platform=macOS' -derivedDataPath build test \
            -jobs 1 ONLY_ACTIVE_ARCH=YES ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -c 2000000

      - name: Build iOS companion
        run: |
          xcodebuild -scheme HogHunterIOS -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -quiet

      - name: Headless UI smoke test
        run: |
          set -o pipefail
          xcodebuild -scheme HogHunter -configuration Release -destination 'platform=macOS' -derivedDataPath build-ui \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -quiet
          # Drives the real views and the real NSApp window list with nobody
          # logged in, then exits non-zero on the first failed check.  This is
          # the gate that was missing: Settings once failed to open at all and
          # 147 unit tests were green.
          "build-ui/Build/Products/Release/HogHunter.app/Contents/MacOS/HogHunter" -HogHunterUISmoke

      - name: Capture app screenshots
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        # The supervisor finishes when capture exits and kills its whole process
        # group, including orphan helpers that could retain runner output handles.
        run: python3 scripts/bounded-process.py --timeout 480 --grace 2 -- bash scripts/capture-app-screenshots.sh

      - name: Upload screenshots artifact
        timeout-minutes: 3
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
