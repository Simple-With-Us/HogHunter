name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check manual release scripts without signing credentials
        run: |
          bash -n scripts/ios-stage-asc-key.sh scripts/ios-appstore-gm-prepare.sh scripts/ios-testflight-release.sh scripts/test-ios-stage-asc-key.sh scripts/capture-app-screenshots.sh
          bash scripts/test-ios-stage-asc-key.sh
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-ios-release.py

  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          if command -v xcpretty >/dev/null 2>&1; then
            set -o pipefail
            xcodebuild -scheme HogHunter -destination 'platform=macOS' -derivedDataPath build test \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | xcpretty
          else
            xcodebuild -scheme HogHunter -destination 'platform=macOS' -derivedDataPath build test \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -quiet
          fi

      - name: Build iOS companion
        run: |
          xcodebuild -scheme HogHunterIOS -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -quiet

      - name: Capture app screenshots
        if: always()
        run: bash scripts/capture-app-screenshots.sh

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 14
