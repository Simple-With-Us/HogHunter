name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check manual release scripts without signing credentials
        run: |
          bash -n scripts/ios-stage-asc-key.sh scripts/ios-appstore-gm-prepare.sh scripts/ios-ship-testflight.sh scripts/ios-fleet/ship-testflight.sh scripts/ios-fleet/scheduled-ship-gate.sh scripts/ios-fleet/test-scheduled-ship-gate.sh scripts/test-ios-stage-asc-key.sh scripts/capture-app-screenshots.sh scripts/install.sh scripts/mac-release-build.sh scripts/make_appcast.sh
          node --check scripts/ios-fleet/asc-api.mjs
          bash scripts/test-ios-stage-asc-key.sh
          bash scripts/ios-fleet/test-asc-credentials.sh
          node --test scripts/ios-fleet/test-asc-credentials.mjs
          bash scripts/ios-fleet/test-scheduled-ship-gate.sh
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-ios-release.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-ios-screenshot-checks.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-bounded-process.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-sentry-ci-report.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-sentry-wiring.py

      - name: Robotic Vacuum Python tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-hoghunter-clean.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-robotic-vacuum.py

  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOGHUNTER_RENDER_DIR: ${{ github.workspace }}/screenshots/native-layout
      TEST_RUNNER_HOGHUNTER_RENDER_DIR: ${{ github.workspace }}/screenshots/native-layout
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # macOS exposes waitid/WNOWAIT in Python 3.13 and newer.  Keep the
      # supervisor and capture dependencies on the same explicit interpreter.
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Test Capture Supervisor on macOS
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-bounded-process.py

      - name: Install dependencies
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages pyobjc-framework-Quartz || python3 -m pip install pyobjc-framework-Quartz

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          if command -v xcpretty >/dev/null 2>&1; then
            set -o pipefail
            xcodebuild -scheme HogHunter -destination 'platform=macOS' -derivedDataPath build test \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | xcpretty
          else
            xcodebuild -scheme HogHunter -destination 'platform=macOS' -derivedDataPath build test \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -quiet
          fi

      - name: Build iOS companion
        run: |
          xcodebuild -scheme HogHunterIOS -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -quiet

      - name: Headless UI smoke test
        run: |
          set -o pipefail
          xcodebuild -scheme HogHunter -configuration Release -derivedDataPath build-ui \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -quiet
          # Drives the real views and the real NSApp window list with nobody
          # logged in, then exits non-zero on the first failed check.  This is
          # the gate that was missing: Settings once failed to open at all and
          # 147 unit tests were green.
          "build-ui/Build/Products/Release/HogHunter.app/Contents/MacOS/HogHunter" -HogHunterUISmoke

      - name: Capture app screenshots
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        # The supervisor finishes when capture exits and kills its whole process
        # group, including orphan helpers that could retain runner output handles.
        run: python3 scripts/bounded-process.py --timeout 480 --grace 2 -- bash scripts/capture-app-screenshots.sh

      - name: Upload screenshots artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
