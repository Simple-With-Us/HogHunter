name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check manual release scripts without signing credentials
        run: |
          bash -n scripts/ios-stage-asc-key.sh scripts/ios-appstore-gm-prepare.sh scripts/ios-testflight-release.sh scripts/test-ios-stage-asc-key.sh scripts/capture-app-screenshots.sh
          bash scripts/test-ios-stage-asc-key.sh
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-ios-release.py

      - name: Robotic Vacuum Python tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-hoghunter-clean.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-robotic-vacuum.py

  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages pyobjc-framework-Quartz || python3 -m pip install pyobjc-framework-Quartz

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          if command -v xcpretty >/dev/null 2>&1; then
            set -o pipefail
            xcodebuild -scheme HogHunter -destination 'platform=macOS' -derivedDataPath build test \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | xcpretty
          else
            xcodebuild -scheme HogHunter -destination 'platform=macOS' -derivedDataPath build test \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -quiet
          fi

      - name: Build iOS companion
        run: |
          xcodebuild -scheme HogHunterIOS -destination 'generic/platform=iOS Simulator' -derivedDataPath build-ios build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -quiet

      - name: Headless UI smoke test
        run: |
          set -o pipefail
          xcodebuild -scheme HogHunter -configuration Release -derivedDataPath build-ui \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -quiet
          # Drives the real views and the real NSApp window list with nobody
          # logged in, then exits non-zero on the first failed check.  This is
          # the gate that was missing: Settings once failed to open at all and
          # 147 unit tests were green.
          "build-ui/Build/Products/Release/HogHunter.app/Contents/MacOS/HogHunter" -HogHunterUISmoke

      - name: Capture app screenshots
        if: always()
        continue-on-error: true
        # Hard cap: the shared macOS-15 runner has hung twice on this step
        # (simulator boot / window detection).  Without a wall-clock limit the
        # 30-minute job timeout fires and fails the whole `test` check, which
        # blocks PR merge because branch protection does not allow admin
        # override of a `cancelled` required status check.  The screenshots are
        # a nice-to-have artifact, not a gate; cap them and let them fail
        # softly so build / unit tests / UI smoke test are what gate merge.
        run: |
          if command -v gtimeout >/dev/null 2>&1; then
            gtimeout --kill-after=30 8m bash scripts/capture-app-screenshots.sh || true
          else
            ( bash scripts/capture-app-screenshots.sh & CAP_PID=$!
              sleep 480
              if kill -0 "$CAP_PID" 2>/dev/null; then
                echo "Capture app screenshots exceeded 8m; killing."
                kill -TERM "$CAP_PID" 2>/dev/null || true
                sleep 5
                kill -KILL "$CAP_PID" 2>/dev/null || true
              fi
              wait "$CAP_PID" 2>/dev/null || true ) || true
          fi

      - name: Upload screenshots artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
